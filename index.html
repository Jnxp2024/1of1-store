<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1 OF 1 · Pre-loved Luxury, Dubai</title>
<meta name="description" content="1 OF 1 — authenticated pre-loved watches, handbags and jewellery from Dubai. Same-day delivery in the UAE, worldwide within a week.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d0c0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/app.js"></script>
</head>
<body>
<header id="hdr"></header>
<div class="gut">
  <div class="intro">
    <h1>Rare pieces. <em>Each one</em> the only one.</h1>
    <p>Authenticated watches, handbags and jewellery from the houses that matter. Can't see it here? Message us, we'll find it.</p>
  </div>
</div>
<main class="gut" id="main"><p class="muted">Loading pieces…</p></main>
<section class="gut" id="results" hidden style="padding-block:28px 72px;display:flex;flex-direction:column;gap:22px">
  <div class="head" style="margin-bottom:0"><div><h2 id="rTitle"></h2><small id="rSub"></small></div><button class="all" id="rClear" style="background:none;border:0;cursor:pointer">Clear search</button></div>
  <div class="grid" id="rGrid"></div>
  <div id="simWrap" hidden><div class="head"><div><h2 style="font-size:22px">Similar pieces</h2><small>You might also like</small></div></div><div class="grid" id="sGrid"></div></div>
</section>
<footer id="ftr"></footer>
<script>
(async () => {
  const d = await loadProducts();
  const cats = d.categories.filter(c => c.items.length);
  renderHeader({ search: true, chips: cats.map(c => ({ title: c.title, href: "#" + c.id })) });
  const main = document.getElementById("main"); main.innerHTML = "";
  cats.forEach(c => {
    const s = document.createElement("section"); s.className = "shelf"; s.id = c.id;
    s.innerHTML = `<div class="head"><div><h2>${esc(c.title)}</h2><small>${c.items.length} ${c.items.length === 1 ? "piece" : "pieces"} · ${esc(c.subtitle)}</small></div>
      <div class="ctrl"><a class="all" href="/category.html?c=${c.id}">View all</a>
      <button class="arrow" data-d="-1" aria-label="Scroll ${esc(c.title)} left">${sv(I.left, 16)}</button>
      <button class="arrow" data-d="1" aria-label="Scroll ${esc(c.title)} right">${sv(I.right, 16)}</button></div></div>
      <div class="row">${c.items.map(cardHTML).join("")}</div>`;
    main.appendChild(s);
    const row = s.querySelector(".row"), [l, r] = s.querySelectorAll(".arrow");
    const upd = () => { l.disabled = row.scrollLeft < 4; r.disabled = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4; };
    [l, r].forEach(a => a.onclick = () => row.scrollBy({ left: a.dataset.d * row.clientWidth * .85 }));
    row.addEventListener("scroll", upd, { passive: true }); requestAnimationFrame(upd); addEventListener("resize", upd);
  });
  bindCards(main);
  const q = document.getElementById("q"), intro = document.querySelector(".intro").parentElement, res = document.getElementById("results");
  const run = () => {
    const term = q.value.trim();
    main.hidden = !!term; intro.hidden = !!term; res.hidden = !term;
    if (!term) return;
    const { results, similar } = searchProducts(d, term);
    document.getElementById("rTitle").textContent = results.length ? `Results for “${term}”` : `No exact match for “${term}”`;
    document.getElementById("rSub").textContent = results.length ? `${results.length} ${results.length === 1 ? "piece" : "pieces"}` : "Here are pieces you might like. Or ask us to source it.";
    const g = document.getElementById("rGrid");
    g.innerHTML = results.length ? results.map(cardHTML).join("") : `<div class="empty" style="grid-column:1/-1;padding:28px 16px">We don't have that listed yet, but we can find it.<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${STORE.whatsapp}?text=${encodeURIComponent("Hello 1 OF 1, I'm looking for: " + term)}">Ask us to source it</a></div>`;
    const sg = document.getElementById("sGrid");
    sg.innerHTML = similar.map(cardHTML).join("");
    document.getElementById("simWrap").hidden = !similar.length;
    bindCards(g); bindCards(sg);
  };
  let t; q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(run, 120); });
  document.getElementById("qf").addEventListener("submit", e => { e.preventDefault(); run(); q.blur(); });
  document.getElementById("rClear").onclick = () => { q.value = ""; run(); q.focus(); };
  const init = new URLSearchParams(location.search).get("q");
  if (init) { q.value = init; run(); }
})();
</script>
</body>
</html>
