<body>
<header id="hdr"></header>
<main class="gut pay-wrap">
  <div class="pay-card" id="card"><p class="muted">Loading payment…</p></div>
</main>
<footer id="ftr"></footer>
<script>
renderHeader();
const P = new URLSearchParams(location.search), ID = P.get("id"), T = P.get("t") || "";
const $ = id => document.getElementById(id);
let O = null, timer = null, poll = null;

function copy(text, btn) {
  const done = () => { const l = btn.textContent; btn.textContent = "Copied"; setTimeout(() => btn.textContent = l, 1400); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done); else done();
}
function qrSvg(text) {
  const q = qrcode(0, "M"); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
}
function uri(o) {
  if (o.coin === "btc") return `bitcoin:${o.address}?amount=${o.amount}`;
  return o.address;
}
async function load() {
  const r = await fetch(`/api/pay/${encodeURIComponent(ID)}?t=${encodeURIComponent(T)}`, { headers: authHeaders() });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) { $("card").innerHTML = `<p class="err">We couldn't find this payment. Open it from your account, or message us on WhatsApp.</p><a class="btn" href="/login">My account</a>`; return; }
  O = j.order; draw();
}
function draw() {
  const o = O;
  if (o.paid) {
    $("card").innerHTML = `<div class="pay-ok">✓</div><span class="eyebrow">Order #${o.id}</span><h1>Payment received</h1>
      <p class="muted">We've received ${esc(o.amount)} ${esc(o.symbol)}. We'll message you on WhatsApp to arrange delivery.</p>
      <a class="btn" href="/login">View my orders</a>`;
    clearInterval(poll); clearInterval(timer); return;
  }
  if (o.status === "cancelled") { $("card").innerHTML = `<h1>Order cancelled</h1><p class="muted">This order was cancelled. Don't send a payment for it.</p>`; return; }
  $("card").innerHTML = `
    <span class="eyebrow">Order #${o.id} · ${aed(o.total_aed)}</span>
    <h1>Send exactly <em>${esc(o.amount)} ${esc(o.symbol)}</em></h1>
    <p class="net">Network: <b>${esc(o.network)}</b>. Only send ${esc(o.symbol)} on this network, or the payment is lost.</p>
    <div class="pay-grid">
      <div class="qr">${qrSvg(uri(o))}</div>
      <div class="pay-fields">
        <label class="f">Amount<div class="copyrow"><code id="amt">${esc(o.amount)} ${esc(o.symbol)}</code><button class="btn ghost" data-c="${esc(o.amount)}">Copy</button></div></label>
        <label class="f">Wallet address<div class="copyrow"><code id="adr">${esc(o.address)}</code><button class="btn ghost" data-c="${esc(o.address)}">Copy</button></div></label>
        ${o.expires ? `<p class="muted lock">Price locked for <b id="left">30:00</b>. After that we recalculate the amount.</p>` : ""}
        <p class="muted tiny">The amount includes a few extra cents so we can match your payment to this order. Please send it exactly.</p>
      </div>
    </div>
    <div class="pay-status" id="status">${o.auto
      ? `<span class="pulse"></span><div><b>Waiting for your payment</b><small>This page checks the blockchain automatically and updates by itself.</small></div>`
      : `<span class="pulse"></span><div><b>Waiting for your payment</b><small>After you send it, paste the transaction ID below so we can confirm faster.</small></div>`}</div>
    <form class="txform" id="txf">
      <label class="f" for="tx">Transaction ID (optional)<input class="in" id="tx" placeholder="Paste the transaction hash" value="${esc(o.tx || "")}" autocomplete="off"></label>
      <button class="btn">${o.tx ? "Update" : "Send to us"}</button>
      <p class="muted tiny" id="txm">${o.tx ? "We have your transaction ID. We'll confirm shortly." : ""}</p>
    </form>
    <a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/${STORE.whatsapp}?text=${encodeURIComponent(`Hello 1 OF 1, I'm paying order #${o.id} with ${o.amount} ${o.symbol} (${o.network}).`)}">Need help? WhatsApp us</a>`;
  $("card").querySelectorAll("[data-c]").forEach(b => b.onclick = e => { e.preventDefault(); copy(b.dataset.c, b); });
  $("txf").onsubmit = async e => {
    e.preventDefault();
    const tx = $("tx").value.trim(), m = $("txm");
    const r = await fetch(`/api/pay/${O.id}/tx`, { method: "POST", headers: { "Content-Type": "application/json", ...authHeaders() }, body: JSON.stringify({ t: T, tx }) });
    const j = await r.json().catch(() => ({}));
    m.textContent = j.ok ? "Got it. We'll confirm your payment shortly." : (j.error || "Couldn't save that, try again.");
    if (j.ok) { O.tx = tx; check(); }
  };
  clearInterval(timer);
  if (o.expires) {
    const tick = () => { const s = Math.max(0, Math.floor((o.expires - Date.now()) / 1000)); const el = $("left"); if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; if (!s) { clearInterval(timer); load(); } };
    tick(); timer = setInterval(tick, 1000);
  }
}
async function check() {
  if (!O || O.paid) return;
  const r = await fetch(`/api/pay/${O.id}/check`, { method: "POST", headers: { "Content-Type": "application/json", ...authHeaders() }, body: JSON.stringify({ t: T }) });
  const j = await r.json().catch(() => ({}));
  if (j.paid) { O.paid = true; draw(); }
}
load().then(() => { poll = setInterval(() => { if (O && O.auto) check(); else load(); }, 20000); });
</script>
</body>
