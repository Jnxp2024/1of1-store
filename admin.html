<body>
<header id="hdr"></header>
<main class="gut">
  <div class="narrow" id="gate" style="padding-top:48px">
    <div><div class="eyebrow">Admin</div><h1 class="page-title">Orders</h1></div>
    <form id="aform" novalidate style="display:flex;flex-direction:column;gap:24px">
      <label class="f" for="pw">Admin password<input class="in" type="password" id="pw" autocomplete="current-password"></label>
      <p class="err" id="aerr" aria-live="polite"></p>
      <button class="btn wide" type="submit">Open dashboard</button>
    </form>
  </div>
  <div id="dash" hidden style="display:flex;flex-direction:column;gap:26px;padding-top:36px">
    <div class="cat-head" style="padding-top:0">
      <div><div class="eyebrow">Admin</div><h1 class="page-title">Orders</h1></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <select class="in" id="filter" aria-label="Filter by status" style="width:auto;font-size:14px"><option value="">All orders</option><option value="pending">Pending</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option><option value="unpaid">Not paid yet</option><option value="paid">Paid</option></select>
        <button class="btn ghost" id="refresh">Refresh</button><button class="btn ghost" id="logout">Lock</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="orders" id="orders"></div>
  </div>
</main>
<footer id="ftr"></footer>
<script>
renderHeader();
const ST = ["pending", "shipped", "delivered", "cancelled"];
const PM = [["", "Not paid yet"], ["cash", "Paid · Cash"], ["card", "Paid · Card at door"], ["online", "Paid · Online payment"], ["applepay", "Paid · Apple Pay"], ["crypto", "Paid · Crypto"]];
let ORD = [];
const pw = () => { try { return sessionStorage.getItem("oo_admin") || ""; } catch { return ""; } };
const api = (path, opt = {}) => fetch(path, { ...opt, headers: { "Content-Type": "application/json", Authorization: "Bearer " + pw(), ...(opt.headers || {}) } });
async function load() {
  const r = await api("/api/orders");
  if (r.status === 401) { try { sessionStorage.removeItem("oo_admin"); } catch {} gate("Wrong password."); return; }
  if (!r.ok) { document.getElementById("orders").innerHTML = `<p class="err">Couldn't load orders (${r.status}).</p>`; return; }
  ORD = (await r.json()).orders; show(); draw();
}
function gate(msg) { document.getElementById("gate").hidden = false; document.getElementById("dash").hidden = true; document.getElementById("aerr").textContent = msg || ""; }
function show() { document.getElementById("gate").hidden = true; document.getElementById("dash").hidden = false; }
function draw() {
  const f = document.getElementById("filter").value;
  const list = ORD.filter(o => !f || (f === "paid" ? o.paid : f === "unpaid" ? !o.paid && o.status !== "cancelled" : o.status === f));
  const live = ORD.filter(o => o.status !== "cancelled");
  document.getElementById("stats").innerHTML = [
    ["Pending", ORD.filter(o => o.status === "pending").length], ["Shipped", ORD.filter(o => o.status === "shipped").length],
    ["Delivered", ORD.filter(o => o.status === "delivered").length],
    ["Collected", aed(live.filter(o => o.paid).reduce((s, o) => s + o.total_aed, 0))],
    ["To collect", aed(live.filter(o => !o.paid).reduce((s, o) => s + o.total_aed, 0))]
  ].map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
  document.getElementById("orders").innerHTML = list.length ? list.map(o => {
    const items = JSON.parse(o.items || "[]");
    const when = new Date(o.created_at.replace(" ", "T") + "Z").toLocaleString("en-GB", { timeZone: "Asia/Dubai", dateStyle: "medium", timeStyle: "short" });
    const warn = o.status === "delivered" && !o.paid ? `<span class="st warn">Payment not recorded</span>` : "";
    return `<div class="order">
      <div class="top"><div><div style="font-size:18px">#${o.id} · ${esc(o.name)}</div><div class="muted" style="font-size:13px">${prettyPhone(o.phone)} · ${when}</div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><span class="st ${esc(o.status)}">${statusLabel(o.status)}</span><span class="st ${o.paid ? "paid" : "unpaid"}">${o.paid ? "Paid" : "Unpaid"}</span>${warn}</div></div>
      <ul>${items.map(i => `<li>${esc(i.brand)} ${esc(i.name)} · ${aed(i.price)}</li>`).join("")}</ul>
      <div class="muted" style="font-size:14px">${esc(o.delivery || "")}${o.note ? "<br>" + esc(o.note) : ""}${o.lat != null ? `<br><a href="https://maps.google.com/?q=${o.lat},${o.lng}" target="_blank" rel="noopener" style="color:var(--champagne)">Open pinned location in Maps</a>` : ""}<br>Payment: ${esc(paymentLine(o))}${o.payment === "crypto" ? `<br><span style="color:var(--champagne)">Crypto: ${esc(o.crypto_amount || "")} ${esc((o.crypto_coin || "").toUpperCase())}</span> to <code style="font-size:12px">${esc(o.crypto_address || "")}</code>${o.crypto_tx ? `<br>Tx: <a target="_blank" rel="noopener" style="color:var(--champagne)" href="${txLink(o)}">${esc(o.crypto_tx.slice(0, 18))}…</a> · check it, then set Payment to Paid · Crypto` : " · no transaction ID yet"}` : ""}${o.paid && o.paid_at ? " · " + new Date(o.paid_at.replace(" ", "T") + "Z").toLocaleString("en-GB", { timeZone: "Asia/Dubai", dateStyle: "medium", timeStyle: "short" }) : ""}</div>
      <div class="top" style="align-items:center"><div style="font-size:20px;font-variant-numeric:tabular-nums">${aed(o.total_aed)}${o.discount_aed ? `<span class="muted" style="font-size:13px;margin-left:10px">${o.discount_kind === "loyalty" ? "10% level-up reward" : "15% first order"} · −${aed(o.discount_aed)}</span>` : ""}</div></div>
      <div class="acts" style="flex-wrap:wrap">
        <label class="mini">Delivery<select class="in" data-id="${o.id}" data-k="status" aria-label="Delivery status for order ${o.id}">${ST.map(s => `<option value="${s}"${s === statusKey(o.status) ? " selected" : ""}>${statusLabel(s)}</option>`).join("")}</select></label>
        <label class="mini">Payment<select class="in" data-id="${o.id}" data-k="paid_method" aria-label="Payment for order ${o.id}">${PM.map(([v, l]) => `<option value="${v}"${(o.paid ? o.paid_method : "") === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
        <button class="btn ghost" style="min-height:40px" data-receipt="${o.id}">Receipt</button>
        <a class="btn ghost" style="min-height:40px" target="_blank" rel="noopener" href="https://wa.me/${esc(o.phone)}?text=${encodeURIComponent(`Hello ${o.name}, thank you for your 1 OF 1 order #${o.id}.`)}">WhatsApp</a>
      </div>
    </div>`;
  }).join("") : '<div class="empty">No orders match.</div>';
}
function txLink(o) { const t = encodeURIComponent(o.crypto_tx); return o.crypto_coin === "btc" ? "https://mempool.space/tx/" + t : o.crypto_coin === "usdt-trc20" ? "https://tronscan.org/#/transaction/" + t : "https://etherscan.io/tx/" + t; }
function statusKey(s) { return { new: "pending", confirmed: "shipped" }[s] || s; }
document.getElementById("aform").addEventListener("submit", e => {
  e.preventDefault();
  try { sessionStorage.setItem("oo_admin", document.getElementById("pw").value); } catch {}
  load();
});
document.getElementById("orders").addEventListener("change", async e => {
  const s = e.target.closest("select[data-id]"); if (!s) return;
  if (s.dataset.k === "status" && s.value === "delivered") {
    const o = ORD.find(x => x.id == s.dataset.id);
    if (o && !o.paid) setTimeout(() => alert("Marked delivered. Remember to set how the customer paid (Payment dropdown)."), 50);
  }
  s.disabled = true;
  const r = await api("/api/orders/" + s.dataset.id, { method: "PATCH", body: JSON.stringify({ [s.dataset.k]: s.value }) });
  if (r.ok) { const j = await r.json(); Object.assign(ORD.find(o => o.id == s.dataset.id), j.order); draw(); }
  else { s.disabled = false; s.insertAdjacentHTML("afterend", `<span class="err"> Couldn't save (${r.status})</span>`); }
});
document.getElementById("orders").addEventListener("click", e => {
  const b = e.target.closest("[data-receipt]"); if (b) downloadReceipt(ORD.find(o => o.id == b.dataset.receipt), b);
});
document.getElementById("filter").onchange = draw;
document.getElementById("refresh").onclick = load;
document.getElementById("logout").onclick = () => { try { sessionStorage.removeItem("oo_admin"); } catch {} gate(); };
if (pw()) load(); else gate();
</script>
</body>
</html>
